[package]
name = "botanica"
version = "0.3.0"
edition = "2021"
description = "Cultivated-plant knowledge base: taxonomy, traits, and provenance on DuckDB"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Michael-A-Kuykendall/botanica"
keywords = ["botany", "cultivation", "database", "plants", "duckdb"]
categories = ["database", "science"]
readme = "README.md"

[dependencies]
duckdb = { version = "1.10504", features = ["bundled", "chrono"] }
tokio = { version = "1.40", features = ["full"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
sha2 = "0.10"
hex = "0.4"
csv = "1.3"

# Optional professional / network features
geo = { version = "0.28", features = ["use-serde"], optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
url = { version = "2.5", optional = true }

[features]
default = []

# Optional modules (incomplete unless noted)
darwin-core = []
herbarium = ["darwin-core", "dep:geo"]
conservation = ["darwin-core", "dep:reqwest", "dep:url"]
germplasm = ["darwin-core", "dep:geo"]
api = ["darwin-core"]
full = ["darwin-core", "herbarium", "conservation", "germplasm", "api"]

# Ingestion for source importers (POWO/GBIF/USDA)
ingestion = ["dep:reqwest", "dep:url"]

[dev-dependencies]
tokio-test = "0.4"
httpmock = "0.7"
serde_json = "1.0"
