name: ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --lib
      - name: KEEP parquet present
        run: test -f data/silver_keep/species/part-000000.parquet || test -f data/silver/species/part-000000.parquet
      - name: parquet size gate (each part < 40 MB, under GitHub limit)
        run: python scripts/shard_parquet.py --data data/silver_keep data/silver --verify-only
